name: CI

# Builds and tests libnoisemaker-qt, nm-render and the unit tests on
# GitHub-hosted macOS, Linux and Windows runners. GitHub-hosted runners only:
# this workflow never targets self-hosted runners.
#
# Jobs:
#   build-test    Configure, build and ctest on all three operating systems,
#                 including the Qt Quick item (NM_QT_BUILD_QUICK=ON).
#                 Linux renders through Mesa llvmpipe under Xvfb; Windows
#                 renders through a checksum-pinned Mesa llvmpipe
#                 opengl32.dll placed next to the executables.
#   warnings      Warnings-as-errors build (Clang/GCC -Wall -Wextra
#                 -Wpedantic -Werror, MSVC /W4 /WX), for hosts that embed the
#                 library under those flags.
#   gates         Compiler, byte, MIDI-state and audio-state gates
#                 (parity/check_*.mjs) against the reference checkout at the
#                 content pin in STATUS.md.
#   render-smoke  Mints goldens for a few fixtures with the reference engine
#                 (Chromium, WebGL2 on ANGLE's GL backend over the job's Mesa
#                 llvmpipe, the candidate's rasterizer: GAP-033), renders
#                 candidates with nm-render on llvmpipe, and grades them with
#                 parity/run.sh at the strict default tolerance. It also runs
#                 the AnalyserNode gate against the same Chromium.
#   render-smoke-windows
#                 Renders the same fixtures with nm-render on the pinned Mesa
#                 llvmpipe opengl32sw.dll and grades them against the goldens
#                 render-smoke minted (GL on llvmpipe on both sides: GAP-033),
#                 and runs the filter/text gate against Qt's DirectWrite font
#                 engine.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 6.11.1 matches the locally verified Homebrew Qt. Qt 6.8.3's macOS
  # package links the AGL framework, which the current macOS SDK lacks
  # (first CI run 35968600167: "ld: framework 'AGL' not found").
  QT_VERSION: "6.11.1"
  # Windows: Qt 6.11 moved its Windows packages to per-arch directories
  # (windows_x86/desktop/qt6_6111/qt6_6111_msvc2022_64/), which aqtinstall
  # 3.3.0, the newest release, cannot read ("Failed to locate XML data for Qt
  # version '6.11.1'", CI run 35970287679). 6.10.3 keeps the layout aqt
  # reads; verified locally: `aqt install-qt windows desktop 6.10.3
  # win64_msvc2022_64 --archives qtbase` installs Qt6Core, Qt6Gui, Qt6OpenGL.
  QT_VERSION_WINDOWS: "6.10.3"
  QT_ARCH_WINDOWS: win64_msvc2022_64
  # pal1000/mesa-dist-win release-msvc archive (llvmpipe opengl32.dll).
  MESA_WIN_URL: https://github.com/pal1000/mesa-dist-win/releases/download/26.2.1/mesa3d-26.2.1-release-msvc.7z
  MESA_WIN_SHA256: 78a0305844074535e73dfb6dcb5eb2a65f1d9dc445102e1f4c3c3e97dace19bf
  SMOKE_FIXTURES: "adjust blendMode cell feedback meshLoaderDefault meshRenderCustom"

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ runner.os == 'Windows' && env.QT_VERSION_WINDOWS || env.QT_VERSION }}
          arch: ${{ runner.os == 'Windows' && env.QT_ARCH_WINDOWS || '' }}
          cache: true

      - name: Install Linux GL and X11 runtime
        if: runner.os == 'Linux'
        run: |
          # Runner images carry third-party apt sources whose stale indexes
          # can fail apt-get update; only Ubuntu archives are needed here.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb mesa-utils libgl1-mesa-dri libegl1 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-image0

      - name: Configure
        # NM_QT_BUILD_QUICK=ON: fail rather than skip the Qt Quick item and
        # test_quick_item if the Qt install lacks Qt Quick.
        run: cmake -S qt -B build -DCMAKE_BUILD_TYPE=Release -DNM_QT_BUILD_QUICK=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Install Mesa llvmpipe opengl32.dll (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri $env:MESA_WIN_URL -OutFile mesa.7z
          $hash = (Get-FileHash mesa.7z -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:MESA_WIN_SHA256) { throw "Mesa archive SHA-256 mismatch: $hash" }
          7z x mesa.7z -omesa | Out-Null
          # Qt loads desktop opengl32.dll from System32 only (the GDI 1.1
          # renderer there fails the 4.1 core check: first CI run
          # 35968600167). With QT_OPENGL=software Qt loads opengl32sw.dll
          # from the executable's directory, so Mesa's opengl32.dll is also
          # installed under that name.
          foreach ($dir in @("build/Release", "build/tests/Release")) {
            Copy-Item mesa/x64/*.dll $dir
            Copy-Item mesa/x64/opengl32.dll (Join-Path $dir "opengl32sw.dll")
          }
          Get-ChildItem build/Release/*.dll | Select-Object Name, Length

      - name: GL renderer (Linux)
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1280x1024x24" glxinfo -B

      - name: ctest (Linux, Xvfb + llvmpipe)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1280x1024x24" ctest --test-dir build --output-on-failure

      - name: ctest (Windows, llvmpipe)
        if: runner.os == 'Windows'
        env:
          GALLIUM_DRIVER: llvmpipe
          QT_OPENGL: software
        run: ctest --test-dir build -C Release --output-on-failure

      - name: ctest (macOS)
        if: runner.os == 'macOS'
        # test_device_limits runs with -V so a passing run still logs
        # GL_RENDERER and the RGBA16F probe and recreated formats (GAP-021).
        run: |
          ctest --test-dir build --output-on-failure -E '^test_device_limits$'
          ctest --test-dir build --output-on-failure -V -R '^test_device_limits$'

  warnings:
    name: warnings-as-errors (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            flags: -Wall -Wextra -Wpedantic -Werror
          - os: ubuntu-latest
            flags: -Wall -Wextra -Wpedantic -Werror
          - os: windows-latest
            flags: /DWIN32 /D_WINDOWS /GR /EHsc /W4 /WX
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ runner.os == 'Windows' && env.QT_VERSION_WINDOWS || env.QT_VERSION }}
          arch: ${{ runner.os == 'Windows' && env.QT_ARCH_WINDOWS || '' }}
          cache: true

      - name: Configure
        shell: bash
        env:
          # Git Bash would rewrite /W4-style MSVC flags as paths (first CI
          # run 35968600167 failed at configure).
          MSYS_NO_PATHCONV: "1"
        run: cmake -S qt -B build -DCMAKE_BUILD_TYPE=Release -DNM_QT_BUILD_QUICK=ON "-DCMAKE_CXX_FLAGS=${{ matrix.flags }}"

      - name: Build library, nm-render and tests
        run: cmake --build build --config Release --parallel

  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out the reference at the STATUS.md content pin
        run: |
          pin=$(grep -oE "to reference .[0-9a-f]{7,40}." STATUS.md | tail -1 | grep -oE "[0-9a-f]{7,40}")
          test -n "$pin" || { echo "no reference pin found in STATUS.md"; exit 1; }
          echo "reference pin: $pin"
          git clone --filter=blob:none https://github.com/noisefactorllc/noisemaker.git "$RUNNER_TEMP/noisemaker"
          git -C "$RUNNER_TEMP/noisemaker" checkout --detach "$pin"
          git -C "$RUNNER_TEMP/noisemaker" rev-parse HEAD

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Build nm-render and gate helpers
        run: |
          cmake -S qt -B qt/build -DCMAKE_BUILD_TYPE=Release
          cmake --build qt/build --parallel

      - name: Compiler and byte gates
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          export NM_REFERENCE_ROOT="$RUNNER_TEMP/noisemaker"
          for gate in shaders definitions registry lex parse validate expand graph midi_state audio_state obj_parser; do
            echo "::group::check_$gate"
            node "parity/check_$gate.mjs"
            echo "::endgroup::"
          done

  render-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out the reference at the STATUS.md content pin
        run: |
          pin=$(grep -oE "to reference .[0-9a-f]{7,40}." STATUS.md | tail -1 | grep -oE "[0-9a-f]{7,40}")
          test -n "$pin" || { echo "no reference pin found in STATUS.md"; exit 1; }
          git clone --filter=blob:none https://github.com/noisefactorllc/noisemaker.git "$RUNNER_TEMP/noisemaker"
          git -C "$RUNNER_TEMP/noisemaker" checkout --detach "$pin"
          git -C "$RUNNER_TEMP/noisemaker" rev-parse HEAD

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the reference engine and Chromium
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          cd "$RUNNER_TEMP/noisemaker"
          npm ci
          npx playwright install --with-deps chromium

      - name: Install Linux GL and X11 runtime
        run: |
          sudo apt-get install -y --no-install-recommends xvfb mesa-utils libgl1-mesa-dri libegl1 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-image0

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Build nm-render
        run: |
          cmake -S qt -B qt/build -DCMAKE_BUILD_TYPE=Release
          cmake --build qt/build --parallel --target nm-render audio_analyzer_dump text_texture_dump

      - name: AnalyserNode gate (Chromium oracle)
        run: NM_REFERENCE_ROOT="$RUNNER_TEMP/noisemaker" node parity/check_audio_analyzer.mjs

      - name: filter/text gate (Chromium oracle, FreeType)
        env:
          QT_QPA_PLATFORM: xcb
        run: |
          NM_REFERENCE_ROOT="$RUNNER_TEMP/noisemaker" \
            xvfb-run -a -s "-screen 0 1280x1024x24" node parity/check_text_canvas.mjs

      - name: Python compare environment
        run: |
          python -m venv parity/.venv
          parity/.venv/bin/pip install numpy pillow

      - name: Mint goldens with the reference engine (ANGLE GL on llvmpipe)
        env:
          # GAP-033: goldens come from the candidate's rasterizer. Headless
          # Chromium ignores --use-angle=gl and draws on SwiftShader, whose
          # edge coverage differs from llvmpipe (meshRenderCustom: 16
          # silhouette pixels). Headed Chromium under Xvfb runs WebGL on
          # ANGLE's GL backend over this job's Mesa llvmpipe.
          SHADE_HEADLESS: "0"
          LIBGL_ALWAYS_SOFTWARE: "1"
          NM_GOLDEN_CHROMIUM_ARGS: "--use-gl=angle --use-angle=gl --ignore-gpu-blocklist"
        run: |
          export NM_REFERENCE_ROOT="$RUNNER_TEMP/noisemaker"
          mkdir -p parity/out
          for name in $SMOKE_FIXTURES; do
            xvfb-run -a -s "-screen 0 1280x1024x24" \
              node parity/export-and-render.mjs "parity/programs/$name.dsl" parity/out --size 256 --time 0.25 --backend webgl2 \
              2>&1 | tee "$RUNNER_TEMP/mint-$name.log"
            grep -q "golden WebGL renderer: ANGLE (Mesa, llvmpipe" "$RUNNER_TEMP/mint-$name.log" \
              || { echo "$name: the golden was not rendered on Mesa llvmpipe"; exit 1; }
          done

      - name: Upload goldens for render-smoke-windows
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: render-smoke-goldens
          # Everything parity/run.sh reads from parity/out: graphs, goldens
          # and the host textures of external-texture fixtures.
          path: |
            parity/out/*.graph.json
            parity/out/*.golden.png
            parity/out/*_step_*.png
          if-no-files-found: error

      - name: Render and grade candidates (strict tolerance, llvmpipe)
        env:
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          status=0
          for name in $SMOKE_FIXTURES; do
            xvfb-run -a -s "-screen 0 1280x1024x24" bash parity/run.sh "$name" || status=1
          done
          exit $status

      - name: Upload smoke images
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: render-smoke
          path: parity/out/
          if-no-files-found: warn

  render-smoke-windows:
    # GAP-033: goldens must come from the candidate's rasterizer. Chromium on
    # the Windows runner cannot draw WebGL on Mesa (run 36038944290: with
    # Mesa registered as the MSOGL ICD, ANGLE's GL backend got a context
    # that failed the ES 3.0 vertex shader), so this job grades against
    # render-smoke's llvmpipe goldens. It runs even when render-smoke fails;
    # without goldens the grading step fails.
    needs: render-smoke
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep checkouts byte-identical to Linux
        # Git for Windows converts LF to CRLF on checkout. The fixture inputs
        # (sidecar OBJ files) and the reference files the text gate reads
        # stay byte-identical to the Linux job's.
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out the reference at the STATUS.md content pin
        run: |
          pin=$(grep -oE "to reference .[0-9a-f]{7,40}." STATUS.md | tail -1 | grep -oE "[0-9a-f]{7,40}")
          test -n "$pin" || { echo "no reference pin found in STATUS.md"; exit 1; }
          echo "reference pin: $pin"
          # The text gate needs the reference's Playwright, its demo font
          # and demo-ui.js; nothing here serves the reference to a browser.
          git clone --filter=blob:none https://github.com/noisefactorllc/noisemaker.git "$RUNNER_TEMP/noisemaker"
          git -C "$RUNNER_TEMP/noisemaker" checkout --detach "$pin"
          git -C "$RUNNER_TEMP/noisemaker" rev-parse HEAD

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the reference engine and Chromium
        run: |
          cd "$RUNNER_TEMP/noisemaker"
          npm ci
          npx playwright install chromium

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.QT_VERSION_WINDOWS }}
          arch: ${{ env.QT_ARCH_WINDOWS }}
          cache: true

      - name: Build nm-render and text_texture_dump
        id: build
        run: |
          cmake -S qt -B qt/build -DCMAKE_BUILD_TYPE=Release
          cmake --build qt/build --config Release --parallel --target nm-render text_texture_dump

      - name: Install Mesa llvmpipe opengl32sw.dll
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri $env:MESA_WIN_URL -OutFile mesa.7z
          $hash = (Get-FileHash mesa.7z -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:MESA_WIN_SHA256) { throw "Mesa archive SHA-256 mismatch: $hash" }
          7z x mesa.7z -omesa | Out-Null
          # Same placement as build-test: with QT_OPENGL=software Qt loads
          # opengl32sw.dll from the executable's directory.
          Copy-Item mesa/x64/*.dll qt/build/Release
          Copy-Item mesa/x64/opengl32.dll qt/build/Release/opengl32sw.dll
          Get-ChildItem qt/build/Release/*.dll | Select-Object Name, Length

      - name: Python compare environment
        run: |
          python -m venv parity/.venv
          parity/.venv/Scripts/python.exe -m pip install numpy pillow

      - name: Download render-smoke's llvmpipe goldens
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: render-smoke-goldens
          path: parity/out

      - name: Render and grade candidates against the Linux goldens (strict tolerance, llvmpipe)
        env:
          GALLIUM_DRIVER: llvmpipe
          QT_OPENGL: software
        run: |
          export NM_RENDER="$PWD/qt/build/Release/nm-render.exe"
          status=0
          for name in $SMOKE_FIXTURES; do
            bash parity/run.sh "$name" || status=1
          done
          exit $status

      - name: filter/text gate (Chromium oracle, DirectWrite)
        # Runs after a render failure too, so both results are reported.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          # Node gets a Windows path (D:/a/...), not the MSYS form.
          workspace=$(pwd -W)
          export NM_REFERENCE_ROOT="$RUNNER_TEMP/noisemaker"
          export NM_TEXT_TEXTURE_DUMP="$workspace/qt/build/tests/Release/text_texture_dump.exe"
          node parity/check_text_canvas.mjs

      - name: Upload smoke images
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: render-smoke-windows
          path: parity/out/
          if-no-files-found: warn
